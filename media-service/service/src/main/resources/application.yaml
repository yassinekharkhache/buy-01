server:
  port: 8802
  error:
    include-message: always

spring:
  application:
    name: media-service
  mongodb:
    uri: mongodb://rootuser:rootpass@localhost:27019/media_service?authSource=admin
  data:
    mongodb:
      auto-index-creation: true
  web:
    error:
      include-message: always
      include-binding-errors: always
  
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: product-group
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        spring.json.value.default.type: com.buy01.media_service.kafka.dto.ProductCreatedEvent

        spring.json.trusted.packages: com.buy01.media_service.kafka.dto

        spring.json.use.type.headers: false

jwt:
  public-key-path: file:${JWT_PUBLIC_KEY}

