server:
  port: 2020
  
jwt:
  public-key-path: file:${JWT_PUBLIC_KEY}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**,/api/auth/**,/api/wishlist/**,/api/wishlist

            - id: media-service
              uri: lb://MEDIA-SERVICE
              predicates:
                - Path=/api/media/**,/product/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
