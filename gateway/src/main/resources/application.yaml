server:
  port: 2020
  

jwt:
  public-key-path: ${JWT_PUBLIC_KEY}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
            - Path=/api/auth/**
        
        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/api/media/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka