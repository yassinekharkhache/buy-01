services:
  mongodb:
    image: mongo:8
    container_name: mongodb_product_service
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - product_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: rootuser
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    networks:
      - mongodb_network_product_service

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express_product_service
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: rootuser
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpass
      ME_CONFIG_MONGODB_SERVER: mongodb

      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: rootuser
      ME_CONFIG_BASICAUTH_PASSWORD: rootpass
    networks:
      - mongodb_network_product_service

volumes:
  product_data:

networks:
  mongodb_network_product_service:
    name: mongodb_network_product_service